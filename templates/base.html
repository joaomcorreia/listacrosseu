{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}"{% if LANGUAGE_BIDI %} dir="rtl"{% endif %}>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ title|default:"ListAcross EU" }}{% endblock %}</title>
    <meta name="description" content="{% block description %}{{ description|default:"Find the best businesses across Europe" }}{% endblock %}">
    
    {% if LANGUAGE_BIDI %}
    <style>
        body {
            direction: rtl;
            text-align: right;
        }
        .navbar {
            flex-direction: row-reverse;
        }
    </style>
    {% endif %}
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="/">{% trans "Home" %}</a>
            <a href="/about/">{% trans "About" %}</a>
            <a href="/contact/">{% trans "Contact" %}</a>
            
            <!-- Language Switcher -->
            <div class="language-switcher">
                <select id="language-select" onchange="changeLanguage(this.value)">
                    <option value="en" {% if LANGUAGE_CODE == 'en' %}selected{% endif %}>English</option>
                    <option value="fr" {% if LANGUAGE_CODE == 'fr' %}selected{% endif %}>Français</option>
                    <option value="nl" {% if LANGUAGE_CODE == 'nl' %}selected{% endif %}>Nederlands</option>
                    <option value="pt" {% if LANGUAGE_CODE == 'pt' %}selected{% endif %}>Português</option>
                    <option value="de" {% if LANGUAGE_CODE == 'de' %}selected{% endif %}>Deutsch</option>
                    <option value="es" {% if LANGUAGE_CODE == 'es' %}selected{% endif %}>Español</option>
                    <option value="ar" {% if LANGUAGE_CODE == 'ar' %}selected{% endif %}>العربية</option>
                </select>
            </div>
        </nav>
    </header>
    
    <main>
        {% block content %}{% endblock %}
    </main>
    
    <footer>
        <p>&copy; 2025 ListAcross EU. {% trans "All rights reserved." %}</p>
    </footer>
    
    <script>
        function changeLanguage(lang) {
            const currentPath = window.location.pathname;
            const pathParts = currentPath.split('/').filter(part => part);
            
            // Remove current language from path if exists
            const languages = ['en', 'fr', 'nl', 'pt', 'de', 'es', 'ar'];
            if (languages.includes(pathParts[0])) {
                pathParts.shift();
            }
            
            // Build new path with selected language
            let newPath = '/' + lang;
            if (pathParts.length > 0) {
                newPath += '/' + pathParts.join('/');
            }
            if (newPath === '/' + lang) {
                newPath += '/';
            }
            
            window.location.href = newPath;
        }
    </script>
</body>
</html>
